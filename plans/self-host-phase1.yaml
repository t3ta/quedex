  # ===== Implement + Verify (sequential: concurrency → stall → gates) =====

  - id: impl-concurrency
    title: "実装: Per-Mode Concurrency"
    mode: implement
    deps: [research-concurrency]
    locks: [workspace]
    codex:
      prompt: |
        Per-Mode Concurrency 機能を quedex に実装してください。

        ## 調査結果
        artifacts/research-concurrency.md を参照してください。

        ## 実装内容

        ### 1. src/plan.rs
        - `TaskMode` enum に `Hash` derive を追加（既存: `Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, JsonSchema, Default`）
        - `TaskMode` に `Display` trait を実装（research/implement/verify を返す）
        - `RunConfig` に以下を追加:
          ```rust
          /// Per-mode concurrency limits. Keys are mode names ("research", "implement", "verify").
          #[serde(default, skip_serializing_if = "Option::is_none")]
          pub max_concurrency_by_mode: Option<HashMap<String, usize>>,
          ```
        - `Plan::validate()` に以下を追加:
          - `max_concurrency_by_mode` の値が 0 の場合はエラー
          - キーが "research", "implement", "verify" 以外の場合はエラー

        ### 2. src/scheduler.rs
        - import に `TaskMode` を追加
        - `SchedulerOptions` を `#[derive(Debug, Clone)]` に変更（Copy を外す）し、以下を追加:
          ```rust
          pub mode_concurrency: HashMap<TaskMode, usize>,
          ```
        - `Scheduler::run()` 内で:
          - モード別 Semaphore map を作成:
            ```rust
            let mode_semaphores: HashMap<TaskMode, Arc<Semaphore>> = self.options.mode_concurrency
                .iter()
                .map(|(&mode, &limit)| (mode, Arc::new(Semaphore::new(limit.max(1)))))
                .collect();
            let mode_semaphores = Arc::new(mode_semaphores);
            ```
          - タスク起動時、global permit 取得後にモード別 permit も取得:
            ```rust
            let mode_permit = if let Some(mode_sem) = mode_semaphores.get(&task.mode) {
                match mode_sem.clone().try_acquire_owned() {
                    Ok(p) => Some(p),
                    Err(_) => {
                        // global permit とロックを返却して queue に戻す
                        release_locks(&lock_table, &task_id, &task.locks);
                        drop(permit);
                        ready_queue.push_back(task_id);
                        rotations += 1;
                        continue;
                    }
                }
            } else {
                None
            };
            ```
          - tokio::spawn 内で `drop(mode_permit)` を追加

        ### 3. src/main.rs
        - `handle_run()` 内で `SchedulerOptions` 構築前に mode_concurrency map を構築:
          ```rust
          fn build_mode_concurrency(plan: &Plan) -> HashMap<quedex::plan::TaskMode, usize> {
              use quedex::plan::TaskMode;
              let mut map = HashMap::new();
              if let Some(ref by_mode) = plan.run.max_concurrency_by_mode {
                  for (mode_str, &limit) in by_mode {
                      let mode = match mode_str.as_str() {
                          "research" => TaskMode::Research,
                          "implement" => TaskMode::Implement,
                          "verify" => TaskMode::Verify,
                          _ => continue,
                      };
                      map.insert(mode, limit);
                  }
              }
              map
          }
          ```
        - `SchedulerOptions` 構築に `mode_concurrency: mode_concurrency.clone()` を追加（2箇所: 通常 run と resume）

        ### 4. テスト
        - `src/scheduler.rs` の既存テスト内 `SchedulerOptions` に `mode_concurrency: HashMap::new()` を追加
        - `src/plan.rs` に `max_concurrency_by_mode` のバリデーションテストを追加

        ## 重要な注意事項
        - `SchedulerOptions` が `Copy` から `Clone` に変わるので、`.clone()` が必要な箇所がないか確認
        - 既存のテストがコンパイルを通るよう `mode_concurrency` フィールドを追加すること
        - serde の HashMap<String, usize> として deserialize し、内部では HashMap<TaskMode, usize> に変換する設計
      verify_after: true
    context:
      inject:
        - from: research-concurrency
          as: "Per-Mode Concurrency 調査結果"

