  - id: impl-stall
    title: "実装: Stall Detection"
    mode: implement
    deps: [research-stall, verify-concurrency]
    locks: [workspace]
    codex:
      prompt: |
        Stall Detection 機能を quedex に実装してください。

        ## 調査結果
        artifacts/research-stall.md を参照してください。

        ## 実装内容

        ### 1. src/plan.rs
        - `RunConfig` に以下を追加:
          ```rust
          /// Default stall timeout in seconds for all tasks.
          /// If a task produces no output for this duration, it is killed.
          /// Set to 0 to disable. Individual tasks can override with their own stall_timeout_sec.
          #[serde(default, skip_serializing_if = "Option::is_none")]
          pub stall_timeout_sec: Option<u64>,
          ```
        - `Task` に以下を追加（`auto_commit` フィールドの前に）:
          ```rust
          /// Stall timeout in seconds for this task.
          /// If the task produces no output for this duration, it is killed.
          /// Set to 0 to disable. None falls back to run.stall_timeout_sec.
          #[serde(default, skip_serializing_if = "Option::is_none")]
          pub stall_timeout_sec: Option<u64>,
          ```

        ### 2. src/store/mod.rs
        - `Event` enum に以下を追加:
          ```rust
          TaskStalled {
              task_id: String,
              stall_timeout_sec: u64,
              #[serde(rename = "ts")]
              timestamp: DateTime<Utc>,
          },
          ```

        ### 3. src/main.rs
        - `PlanTaskRunner` struct に `default_stall_timeout_sec: Option<u64>` フィールドを追加
        - `PlanTaskRunner::new()` に引数追加、`PlanTaskRunner` 構築箇所（handle_run 内）で `plan.run.stall_timeout_sec` を渡す
        - `spawn()` メソッド内の async block で `default_stall_timeout_sec` を clone
        - タスク実行ループ内の `child.wait()` 前後を以下のように変更:
          1. stall timeout を解決: `let stall_timeout = task.stall_timeout_sec.or(default_stall_timeout_sec);`
          2. `stall_timeout` が `Some(t)` かつ `t > 0` の場合:
             - stall monitor を `tokio::spawn` で起動:
               - stdout/stderr ファイルサイズを1秒間隔で監視
               - サイズ変化がなければカウンタ増加
               - カウンタが stall_timeout_sec に達したら `child_for_stall.kill()` して `Event::TaskStalled` を記録し return
             - `wait_future` と `stall_handle` を同時に待機（wait_future が先に完了したら stall_handle.abort()）
          3. `stall_timeout` が None または 0 の場合: 従来通り `spawn_blocking(move || child.wait())`

        ## 重要な注意事項
        - `cancel.unregister()` はどちらのパスでも確実に呼ぶこと
        - stall kill 後は `TaskResult::failed(1)` として retry ループに乗せる（既存の retry 機構がそのまま適用される）
        - `ChildHandle` の `kill()` メソッドは既に存在する（src/runner/mod.rs）ので新規実装不要
      verify_after: true
    context:
      inject:
        - from: research-stall
          as: "Stall Detection 調査結果"

