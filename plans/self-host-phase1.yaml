  - id: impl-gates
    title: "実装: Completion Gates"
    mode: implement
    deps: [research-gates, verify-stall]
    locks: [workspace]
    codex:
      prompt: |
        Completion Gates 機能を quedex に実装してください。

        ## 調査結果
        artifacts/research-gates.md を参照してください。

        ## 実装内容

        ### 1. src/plan.rs
        - `CompletionGate` struct を追加:
          ```rust
          /// A completion gate that runs after a task exits successfully.
          #[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]
          pub struct CompletionGate {
              /// Human-readable name for this gate
              pub name: String,
              /// Command to execute (run via sh -c)
              pub command: String,
              /// Timeout in seconds for this gate (default: 300)
              #[serde(default = "default_gate_timeout_sec")]
              #[schemars(default = "default_gate_timeout_sec")]
              pub timeout_sec: u64,
          }

          fn default_gate_timeout_sec() -> u64 { 300 }
          ```
        - `RunConfig` に以下を追加:
          ```rust
          /// Default completion gates applied to implement and verify mode tasks.
          #[serde(default, skip_serializing_if = "Option::is_none")]
          pub default_gates: Option<Vec<CompletionGate>>,
          ```
        - `Task` に以下を追加（`stall_timeout_sec` の後に）:
          ```rust
          /// Completion gates to run after this task exits successfully.
          /// Overrides default_gates if set.
          #[serde(default, skip_serializing_if = "Option::is_none")]
          pub completion_gates: Option<Vec<CompletionGate>>,
          /// Skip completion gates for this task.
          #[serde(default)]
          pub skip_gates: bool,
          ```
        - `Plan::validate()` に以下を追加:
          - `default_gates` の各 gate について name と command が空でないことを確認
          - タスクの `completion_gates` の各 gate について同様のバリデーション

        ### 2. src/store/mod.rs
        - `Event` enum に以下を追加:
          ```rust
          GateStarted {
              task_id: String,
              gate_name: String,
              #[serde(rename = "ts")]
              timestamp: DateTime<Utc>,
          },
          GateFinished {
              task_id: String,
              gate_name: String,
              #[serde(rename = "code")]
              exit_code: i32,
              #[serde(rename = "ts")]
              timestamp: DateTime<Utc>,
          },
          ```

        ### 3. src/main.rs
        - `PlanTaskRunner` struct に `default_gates: Option<Vec<quedex::plan::CompletionGate>>` フィールドを追加
        - `PlanTaskRunner::new()` に引数追加、構築箇所で `plan.run.default_gates.clone()` を渡す
        - `spawn()` メソッド内の async block で `default_gates` を clone
        - タスク実行ループ内、`map_exit_status` で result を取得した直後に以下のロジックを追加:
          1. `result.status == TaskStatus::Succeeded` かつ `!task.skip_gates` の場合:
          2. ゲートを解決: `task.completion_gates` があればそれを使用、なければ implement/verify モードなら `default_gates` を使用
          3. ゲートがある場合、順次実行:
             - `Event::GateStarted` を記録
             - `sh -c "{command}"` を cwd で実行（`tokio::time::timeout` で gate.timeout_sec を適用）
             - stdout/stderr をタスクのログファイルに追記
             - `Event::GateFinished` を記録
             - exit code != 0 またはタイムアウトの場合: `result = TaskResult::failed(1)` にして break

        - ゲート実行用のヘルパー関数を追加:
          ```rust
          async fn run_completion_gate(
              gate: &quedex::plan::CompletionGate,
              cwd: &Path,
              task_id: &str,
              store: &Arc<FsStore>,
          ) -> bool {
              // sh -c でコマンド実行、stdout/stderr をタスクログに追記
              // timeout_sec でタイムアウト
              // 成功なら true、失敗なら false
          }
          ```

        ## 重要な注意事項
        - ゲート実行は runner 成功後・retry 判定前に行う
        - ゲート失敗時は `result` を `TaskResult::failed(1)` に書き換えて、既存の retry ループに乗せる
        - `auto_commit` はゲートがすべてパスした後に実行される（scheduler 側の handle_event で処理されるため変更不要）
        - gate の stdout/stderr はタスクの既存ログファイル（stdout.log/stderr.log）に追記する
      verify_after: true
    context:
      inject:
        - from: research-gates
          as: "Completion Gates 調査結果"

